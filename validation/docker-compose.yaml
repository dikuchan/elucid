name: elucid-validation

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: elucid
      POSTGRES_PASSWORD: elucid-validation
      POSTGRES_USER: elucid
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=elucid --dbname=elucid"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: elucid-validation
      MINIO_ROOT_USER: elucid
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    profiles: ["setup"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: elucid
      MINIO_ROOT_PASSWORD: elucid-validation
      MINIO_ROOT_USER: elucid
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mc alias set validation http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "validation/$${MINIO_BUCKET}"
    restart: "no"

volumes:
  minio-data:
  postgres-data:
