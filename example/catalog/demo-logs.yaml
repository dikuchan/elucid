format_version: 1
source:
  name: demo_logs
  display_name: Demo logs
  active_schema_version: 1
  schemas:
    - version: 1
      fields:
        - name: message
          logical_type: utf8
          nullability: NON_NULL
        - name: service
          logical_type: utf8
          nullability: NULLABLE
        - name: status
          logical_type: int32
          nullability: NULLABLE
  inputs:
    - name: vector
      active_ingestion_profile_revision: 1
      ingestion_profile_revisions:
        - revision: 1
          target_schema_version: 1
          maximum_record_bytes: 1048576
          event_time:
            json_pointer: /timestamp
            format: RFC3339
          mappings:
            - target_field: message
              json_pointer: /message
            - target_field: service
              json_pointer: /service
            - target_field: status
              json_pointer: /status
