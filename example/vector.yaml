data_dir: /var/lib/vector

sources:
  generated_http_logs:
    type: demo_logs
    format: json
    interval: 0.002
    decoding:
      codec: json

  invalid_status_fixture:
    type: demo_logs
    format: shuffle
    interval: 60.0
    lines:
      - '{"message":"Invalid status fixture","service":"auth","status":"not-an-integer","region":"eu-west-1"}'
    decoding:
      codec: json

transforms:
  prepare_generated_http_logs:
    type: remap
    inputs:
      - generated_http_logs
    source: |
      .message = join!([
        to_string!(.method),
        to_string!(.request),
        to_string!(.protocol),
        to_string!(.status),
      ], " ")
      .status = to_int!(.status)
      service_roll = random_int(min: 0, max: 3)
      .service = if service_roll == 0 {
        "auth"
      } else if service_roll == 1 {
        "edge"
      } else {
        "api"
      }
      region_roll = random_int(min: 0, max: 3)
      .region = if region_roll == 0 {
        "eu-west-1"
      } else if region_roll == 1 {
        "us-east-1"
      } else {
        "eu-central-1"
      }
      .trace_id = uuid_v7()
      .timestamp = format_timestamp!(now(), format: "%Y-%m-%dT%H:%M:%S%.3fZ")
      del(.source_type)

  prepare_invalid_status_fixture:
    type: remap
    inputs:
      - invalid_status_fixture
    source: |
      .timestamp = format_timestamp!(now(), format: "%Y-%m-%dT%H:%M:%S%.3fZ")
      .fixture_id = uuid_v7()
      del(.source_type)

sinks:
  elucid:
    type: http
    inputs:
      - prepare_generated_http_logs
      - prepare_invalid_status_fixture
    uri: http://elucid:58080/api/v1/sources/demo_logs/inputs/vector/events
    method: post
    compression: none
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_bytes: 4194304
      max_events: 5000
      timeout_secs: 2
    buffer:
      type: disk
      max_size: 536870912
      when_full: block
    healthcheck:
      enabled: true
      uri: http://elucid:58080/health/ready
    request:
      headers:
        Content-Type: application/x-ndjson
      timeout_secs: 65
      retry_max_duration_secs: 30
    retry_strategy:
      type: default
