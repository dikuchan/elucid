[workspace]
resolver = "2"
members = [
    "elucid-catalog",
    "elucid-cli",
    "elucid-engine",
    "elucid-ingest",
    "elucid-language",
    "elucid-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.dependencies]
anyhow = "1.0.100"
ariadne = "0.6.0"
arrow = "57.1.0"
bytes = "1.11.0"
chrono = "0.4.42"
chumsky = "1.0.0-alpha.8"
clap = "4.5.53"
datafusion = "51.0.0"
futures = "0.3.31"
insta = "1.44.3"
logos = "0.16.0"
nu-ansi-term = "0.50.3"
object_store = "0.12.4"
parquet = "57.1.0"
reedline = "0.44.0"
reqwest = { version = "0.12.28", default-features = false }
serde = "1.0.228"
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tempfile = "3.23.0"
testcontainers-modules = "0.15.0"
thiserror = "2.0.17"
tokio = "1.48.0"
tokio-stream = "0.1.18"
url = "2.5.7"
uuid = "1.19.0"

elucid-catalog = { path = "elucid-catalog" }
elucid-engine = { path = "elucid-engine" }
elucid-ingest = { path = "elucid-ingest" }
elucid-language = { path = "elucid-language" }
